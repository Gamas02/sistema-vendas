services:
  db:
    image: postgres:16
    container_name: sistema-vendas-db
    environment:
      POSTGRES_DB: sistema_vendas
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: "123"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d sistema_vendas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: sistema-vendas-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sistema_vendas
      DB_USER: usuario
      DB_PASSWORD: "123"
      ADMIN_EMAIL: admin@vendas.com
      ADMIN_SENHA: admin123
    ports:
      - "8080:8080"

volumes:
  pgdata:
