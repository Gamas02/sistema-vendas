<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Excluir Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<div class="container mt-4">
    <h1>Excluir Pedido</h1>

    <div class="alert alert-danger">
        <p>Tem certeza que deseja excluir o pedido <strong th:text="${pedido.id}"></strong>?</p>
    </div>

    <table class="table table-bordered">
        <tr>
            <th>Cliente</th>
            <td th:text="${pedido.cliente.nome}"></td>
        </tr>
        <tr>
            <th>Data</th>
            <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr>
            <th>Valor Total</th>
            <td th:text="${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
    </table>

    <form th:action="@{/pedidos/delete/{id}(id=${pedido.id})}" method="post">
        <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
        <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
