<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<div class="container mt-5">
    <h2 th:text="${pedidoForm.id == null} ? 'Novo Pedido' : 'Editar Pedido'"></h2>
    <form th:action="@{${pedidoForm.id == null} ? '/pedidos/novo' : '/pedidos/edit/' + ${pedidoForm.id}}" th:object="${pedidoForm}" method="post">
        <div class="mb-3">
            <label for="clienteId" class="form-label">Cliente</label>
            <select class="form-select" id="clienteId" th:field="*{clienteId}">
                <option value="">Selecione...</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
        </div>

        <div class="mb-3">
            <label for="valorTotal" class="form-label">Valor Total</label>
            <input type="number" step="0.01" min="0" class="form-control" id="valorTotal" th:field="*{valorTotal}">
            <div class="text-danger" th:if="${#fields.hasErrors('valorTotal')}" th:errors="*{valorTotal}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
